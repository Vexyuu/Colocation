faq.title: "Frequently Asked Questions"
faq.subtitle: "Clear answers to your most common questions."
faq.q1: "How is the utility share calculated?"
faq.a1: "The utility share represents the percentage a tenant owes on a global invoice (e.g. electricity) based on their room surface compared to the total surface of the flat: (Room Surface / Total Surface) × 100."
faq.q2: "What is CoLive's commitment to Green IT?"
faq.a2: "CoLive is green-designed from the ground up. We optimize SQL queries to minimize server load, use zero heavy JS frameworks, and style with a tailor-made, ultra-lightweight pure CSS code."
faq.q3: "Are flatmate and landlord spaces fully separated?"
faq.a3: "Yes, absolutely. Using Symfony's native firewalls and role-based access control, the spaces are totally isolated. A tenant can never access a landlord's dashboard, and vice versa."
faq.q4: "How do I download my rent receipt?"
faq.a4: "Once logged into your Tenant Space, you access your payment history. As soon as the landlord validates receipt of your rent, a download button appears to instantly retrieve your receipt in a print-ready layout."
