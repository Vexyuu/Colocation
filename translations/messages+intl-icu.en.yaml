legal.cgu_title: "General Terms of Use"
legal.cgu_intro: "The use of the CoLive platform implies full acceptance of the general terms of use outlined below."
legal.cgu_sec1_title: "Purpose of the Service"
legal.cgu_sec1_text: "CoLive is a digital tool designed to facilitate flatsharing management, including theoretical calculations of expense shares and household chores allocation. Calculations are provided for information purposes based on dimensions supplied by users."
legal.cgu_sec2_title: "User Responsibility"
legal.cgu_sec2_text: "Landlords agree to provide accurate and certified room surface measurements. Tenants agree to use the messaging and chores features in a respectful manner."
legal.cgu_sec3_title: "Messaging & Content"
legal.cgu_sec3_text: "Any message of an offensive, defamatory, or unlawful nature is strictly prohibited and may result in the permanent deletion of the user's account."
legal.rgpd_title: "Privacy Policy & GDPR"
legal.rgpd_intro: "In managing your flatshare, CoLive is required to collect and process some of your personal data in compliance with the General Data Protection Regulation (GDPR)."
legal.rgpd_sec1_title: "Data Collected"
legal.rgpd_sec1_text: "We collect only data strictly necessary for the service: last name, first name, email address, occupied room surface, and messaging and receipt histories."
legal.rgpd_sec2_title: "Purpose of Processing"
legal.rgpd_sec2_text: "Your data is only processed for the internal operation of the application (calculating expense shares, generating receipts, sending notifications and messages). No data is ever sold or shared with third parties."
legal.rgpd_sec3_title: "Your Rights"
legal.rgpd_sec3_text: "Under the GDPR, you have the right to access, rectify, and erase your personal data. To exercise these rights, you may delete your account or contact our Data Protection Officer by email."

