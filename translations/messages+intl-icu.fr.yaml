legal.cgu_title: "Conditions Générales d'Utilisation"
legal.cgu_intro: "L'utilisation de la plateforme CoLive implique l'acceptation pleine et entière des conditions d'utilisation ci-après."
legal.cgu_sec1_title: "Objet du service"
legal.cgu_sec1_text: "CoLive est un outil numérique facilitant la colocation, incluant le calcul théorique des tantièmes de charges et la répartition des tâches ménagères. Les calculs sont fournis à titre indicatif selon les dimensions saisies par les utilisateurs."
legal.cgu_sec2_title: "Responsabilité des utilisateurs"
legal.cgu_sec2_text: "Le propriétaire bailleur s'engage à saisir des informations réelles et certifiées concernant les superficies des chambres. Les locataires s'engagent à faire un usage respectueux de l'outil de messagerie et de tâches."
legal.cgu_sec3_title: "Messagerie & Contenus"
legal.cgu_sec3_text: "Tout message à caractère injurieux, diffamatoire ou illicite est strictement interdit et pourra entraîner la suppression définitive du compte de l'utilisateur."
legal.rgpd_title: "Politique de Confidentialité & RGPD"
legal.rgpd_intro: "Dans le cadre de la gestion de votre colocation, CoLive est amené à collecter et traiter certaines de vos données personnelles conformément au Règlement Général sur la Protection des Données (RGPD)."
legal.rgpd_sec1_title: "Données collectées"
legal.rgpd_sec1_text: "Nous collectons uniquement les données strictement nécessaires au service : nom, prénom, adresse email, superficie de la chambre occupée, et historiques d'échanges de messages et de quittances."
legal.rgpd_sec2_title: "Finalité des traitements"
legal.rgpd_sec2_text: "Vos données sont uniquement utilisées pour l'exploitation interne de l'application (calcul des charges au tantième, génération des quittances, transmission de messages de signalement). Aucune donnée n'est vendue ou partagée avec des tiers."
legal.rgpd_sec3_title: "Vos droits"
legal.rgpd_sec3_text: "Conformément au RGPD, vous disposez d'un droit d'accès, de rectification et d'effacement de vos données personnelles. Pour exercer ces droits, vous pouvez supprimer votre compte ou contacter notre délégué à la protection des données par courriel."

