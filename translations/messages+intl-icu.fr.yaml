faq.title: 'Foire Aux Questions'
faq.subtitle: 'Des réponses claires à vos questions les plus courantes.'
faq.q1: 'Comment est calculé le tantième de charge ?'
faq.a1: "Le tantième de charge représente le pourcentage qu'un colocataire doit payer sur une facture globale (ex: électricité) selon la surface de sa chambre par rapport à la superficie totale de l'appartement : (Surface Chambre / Surface Totale) × 100."
faq.q2: "Qu'est-ce que l'engagement Green IT de CoLive ?"
faq.a2: "CoLive est éco-conçu de A à Z. Nous optimisons nos requêtes SQL pour solliciter le serveur au minimum, nous n'utilisons aucun framework JavaScript lourd et notre design utilise un code CSS pur ultra-léger et sur-mesure."
faq.q3: 'Les espaces colocataires et propriétaires sont-ils hermétiques ?'
faq.a3: "Oui, absolument. Grâce aux pare-feux et aux contrôles d'accès natifs de Symfony, les espaces sont totalement isolés. Un locataire ne peut en aucun cas accéder aux données d'un propriétaire, et réciproquement."
faq.q4: 'Comment télécharger ma quittance de loyer ?'
faq.a4: "Une fois connecté à votre Espace Locataire, vous accédez à l'historique de vos paiements. Dès que le propriétaire valide la réception de votre loyer, un bouton de téléchargement apparaît pour récupérer instantanément votre quittance au format PDF."
